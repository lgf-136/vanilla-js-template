name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to verify
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PR 事件检出 PR 头提交(而非自动生成的 merge commit,其信息永远无法
          # 通过 Conventional Commits 校验);push/手动触发用 github.ref
          ref: ${{ inputs.ref || (github.event.pull_request && github.event.pull_request.head.sha) || github.ref }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # 项目零第三方依赖：无需 npm install，仅安装 just 命令面
      - name: Install just
        uses: casey/just@v0.5.4

      - name: deps:check（无第三方依赖）
        run: just deps:check

      - name: commit-msg（Conventional Commits + 逐文件正文）
        run: just commit-check

      - name: lint
        run: just lint

      - name: test（node --test）
        run: just test

      - name: i18n:check（三语言 key 一致）
        run: just i18n:check

      - name: build + build:budget（体积预算）
        run: just build:budget
